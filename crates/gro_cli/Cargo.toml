[package]
name = "gro_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "the fgro binary, gro on its own JS runtime (experimental)"

[[bin]]
name = "fgro"
path = "src/main.rs"

[dependencies]
argh.workspace = true
gro_runtime = { path = "../gro_runtime" }

[dev-dependencies]
url.workspace = true

[features]
# start from a snapshot embedded at compile time, read from `GRO_SNAPSHOT_DIR`;
# `cargo xtask build` sets it up
snapshot = []

[lints]
workspace = true
