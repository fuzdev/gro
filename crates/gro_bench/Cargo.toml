[package]
name = "gro_bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "gro's measurement harness for comparing JS runtimes"

[dependencies]
blake3.workspace = true
serde.workspace = true
# `unbounded_depth`: a stdout value as deep as eval's serializer writes,
# past serde_json's default depth of 128, parsed on a sized stack
serde_json = { workspace = true, features = ["unbounded_depth"] }
thiserror.workspace = true

# each sample's peak memory, read as it's reaped (`wait4`)
[target.'cfg(target_os = "linux")'.dependencies]
gro_sys = { path = "../gro_sys" }

[lints]
workspace = true
