[package]
name = "gro_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "gro's JS host: a minimal web-standards runtime on V8"

[dependencies]
blake3.workspace = true
deno_core.workspace = true
deno_web.workspace = true
deno_webidl.workspace = true
getrandom.workspace = true
# the system calls std lacks: the out-of-memory backstop's exit, which skips
# the process's teardown, the thread count the box checks, a thread's stack
# start, `fs`'s calls beneath a descriptor, and `spawn`'s children, held by
# their pidfds
gro_sys = { path = "../gro_sys", features = ["child"] }
gro_v8 = { path = "../gro_v8" }
landlock.workspace = true
# the kernel's constants: the box's, `fs`'s error numbers, and `ELOOP` and
# `O_NONBLOCK` for the resolver's reads
libc.workspace = true
seccompiler.workspace = true
serde.workspace = true
# preserve_order: an "exports" object matches in the package's own key order
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tokio.workspace = true
tsv_css.workspace = true
tsv_ignore.workspace = true
tsv_svelte.workspace = true
tsv_ts.workspace = true
url.workspace = true

[dev-dependencies]
# the measurement harness, which keeps its own copies of the phases file's
# contract and names eval's defaults in its prices suite, checked against
# these (an in-workspace crate with no V8)
gro_bench = { path = "../gro_bench" }

# a child process installing the run's seccomp denylist from its one thread,
# as a box installs it, which libtest's harness, with its threads, would leave
# partly outside the filter
[[test]]
name = "denylist"
harness = false

[features]
# phase timings for the measurement harness (`phases`); the binary that ships
# never enables it
phases = []
# switches that each turn off one of eval's defaults or a step of a command's
# box, read from `GRO_PRICES_OFF`, for the bench's prices suites; the binary
# that ships never enables it
prices = []

[lints]
workspace = true
