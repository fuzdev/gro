[package]
name = "gro_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "gro's JS host: a minimal web-standards runtime on V8"

[dependencies]
blake3.workspace = true
deno_core.workspace = true
deno_web.workspace = true
deno_webidl.workspace = true
getrandom.workspace = true
gro_v8 = { path = "../gro_v8" }
serde.workspace = true
# preserve_order: an "exports" object matches in the package's own key order
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tokio.workspace = true
tsv_ts.workspace = true
url.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# the out-of-memory backstop's exit, which skips the process's teardown, and
# the thread count the box checks
gro_sys = { path = "../gro_sys" }
landlock.workspace = true
libc.workspace = true
seccompiler.workspace = true

[features]
# phase timings for the measurement harness (`phases`); release and snapshot
# builds never enable it
phases = []
# switches that each turn off one of eval's defaults, read from `GRO_PRICES_OFF`,
# for the bench's prices suite; release and snapshot builds never enable it
prices = []

[lints]
workspace = true
