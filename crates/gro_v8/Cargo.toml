[package]
name = "gro_v8"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "gro's V8 boundary: the V8 calls rusty_v8 exposes only as `unsafe`, behind a safe API"

# no tests of its own: gro_runtime's test the reader, so V8 links into one
# fewer test binary
[lib]
test = false

[dependencies]
v8.workspace = true

# The workspace's lint table, re-declared whole (Cargo replaces the table, so a
# partial override would drop the rest), with `unsafe_code` at `deny` instead
# of `forbid`, so each `unsafe` block can carry its own `#[expect]`, and every
# `unsafe` block required to say why it's sound. xtask's `lints` test checks
# it equals the workspace's `[workspace.lints]` but those two.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"
redundant_explicit_links = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

assert_is_empty = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"

significant_drop_tightening = "allow"

cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

clone_on_ref_ptr = "warn"
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unwrap_used = "warn"

# every `unsafe` block carries a `// SAFETY:` comment
undocumented_unsafe_blocks = "warn"
