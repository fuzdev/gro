# Checks and builds the project. For more info:
# https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  # Allow manually re-running the check from the Actions tab.
  workflow_dispatch:

# Cancel a PR's in-progress run when a new commit supersedes it; let main-branch
# runs finish so every commit on main stays verified.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: the check only reads the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: ['24.14']

    steps:
      # persist-credentials: false keeps the GITHUB_TOKEN out of .git/config, so a
      # compromised build dependency can't read it. If you add a step that pushes
      # via git (deploy, tag, generated commit), set this back to true or
      # authenticate that step explicitly.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run bootstrap
      - run: npx @fuzdev/gro check --workspace --build
      # The JS/TS under crates/ (the runtime's extension sources, the bench
      # workloads, the test fixtures), which `gro check` doesn't reach and the
      # rust job has no Node for. It builds only the xtask, with the toolchain
      # rust-toolchain.toml pins, installed explicitly as the rust job does.
      - name: Install Rust
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain
          cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check the JS/TS under crates/
        run: cargo xtask check-js

  # The Rust workspace (crates/), beside the npm package; `gro check` doesn't
  # reach it, so it gets its own job. Locally, `cargo xtask check` runs these
  # gates and `gro check` together.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # persist-credentials: false keeps the GITHUB_TOKEN out of .git/config (no
      # step here pushes via git).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # The runner's preinstalled rustup installs the toolchain and components
      # pinned in rust-toolchain.toml; any rustup 1.28+ reads it with no
      # arguments, so skip self-updating it.
      - name: Install Rust
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Every cargo build links the pinned V8 archive that .cargo/config.toml
      # names (RUSTY_V8_ARCHIVE), so fetch it and verify its SHA-256 first.
      - name: Fetch V8
        run: cargo xtask fetch-v8

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # --no-fail-fast: report every failing test binary, not just the first.
      - name: Test
        run: cargo test --locked --workspace --no-fail-fast

      # The rustdoc lints fire only under `cargo doc`; private items too, so
      # the links in their docs are checked.
      - name: Doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --document-private-items

      # fgro with an embedded startup snapshot, its tests, and a run with the
      # build tree's sources hidden in a private user and mount namespace,
      # which the runner's AppArmor policy forbids by default.
      - name: Snapshot
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          cargo xtask build --verify
