# Checks and builds the project. For more info:
# https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  # Allow manually re-running the check from the Actions tab.
  workflow_dispatch:

# Cancel a PR's in-progress run when a new commit supersedes it; let main-branch
# runs finish so every commit on main stays verified.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: the check only reads the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: ['24.14']

    steps:
      # persist-credentials: false keeps the GITHUB_TOKEN out of .git/config, so a
      # compromised build dependency can't read it. If you add a step that pushes
      # via git (deploy, tag, generated commit), set this back to true or
      # authenticate that step explicitly.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run bootstrap
      - run: npx @fuzdev/gro check --workspace --build
      # The JS/TS under crates/ (the runtime's extension sources, the bench
      # workloads, the test fixtures), which `gro check` doesn't reach and the
      # rust job has no Node for. It builds only the xtask, with the toolchain
      # rust-toolchain.toml pins, installed explicitly as the rust job does.
      - name: Install Rust
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain
          cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check the JS/TS under crates/
        run: cargo xtask check-js

  # The Rust workspace (crates/), beside the npm package; `gro check` doesn't
  # reach it, so it gets its own job. Locally, `cargo xtask check` runs these
  # gates (`check-rust`), the JS/TS step (`check-js`), and `gro check` together.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # persist-credentials: false keeps the GITHUB_TOKEN out of .git/config (no
      # step here pushes via git).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # The runner's preinstalled rustup installs the toolchain and components
      # pinned in rust-toolchain.toml; any rustup 1.28+ reads it with no
      # arguments, so skip self-updating it.
      - name: Install Rust
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The Rust gates as `cargo xtask check` runs them, in one command: the
      # pinned V8 archive (fetched, SHA-256 verified), the vendored crates
      # (each its published crate, fetched and verified, plus its patch), fmt,
      # clippy, the V8 library copy checked before the tests run V8 code, test,
      # doc, and fgro with an embedded startup snapshot, verified by remaking
      # the snapshot byte for byte, by its tests, and by a run with the build
      # tree's sources hidden in a private user and mount namespace, which the
      # runner's AppArmor policy forbids by default.
      - name: Check
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          cargo xtask check-rust

  # The claim that a clean checkout of one commit, with the same toolchain and
  # cargo home, builds the same release fgro, byte for byte, from any path:
  # the release fgro built in this checkout and again in a clone of its commit
  # at another path, outside the workspace, compared byte for byte, failing
  # with the sections that differ. Its own job, beside the others, since it is
  # two release builds, the clone's always cold. The toolchain is the system's
  # too: the C compiler and C library reach the binary (its startup objects,
  # the C a build script compiles), so the job runs on the release's image.
  # It proves the release build path-independent there, not a release's own
  # bytes, which build under another cargo home. It can't see a build on
  # another machine, with another toolchain, or with another cargo home,
  # which the claim excludes, or what both builds read alike on this runner:
  # a directory's listing order on one filesystem, the day's date, a cache
  # they share. It turns rustc wrappers off for both builds, and refuses a
  # rustc wrapper in its own environment, a cargo config only the clone's
  # build would read (in the clone's directory or above it, not above the
  # checkout), and a dirty tree (an untracked file git doesn't ignore as well
  # as a changed one) or one outside git, whose build embeds another commit
  # by design; actions/checkout's tree is clean.
  reproducible:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # persist-credentials: false keeps the GITHUB_TOKEN out of .git/config (no
      # step here pushes via git).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # As the rust job installs it, from rust-toolchain.toml.
      - name: Install Rust
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain
          cargo --version

      # The registry, which both builds share, and this checkout's target
      # dependencies; the clone's target dir is outside the workspace and
      # never cached.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # rust-cache sets CARGO_INCREMENTAL for later steps; the clone builds from
      # a cleared environment, so the check refuses it unless both builds lose it.
      - name: Check that fgro builds reproducibly
        run: env -u CARGO_INCREMENTAL cargo xtask check-reproducible
