[alias]
xtask = "run --locked -p xtask --"

[env]
# the pinned V8 archive the `v8` build script links instead of downloading
# one. Plain cargo copies whatever file is at this path, unchecked, and doesn't
# recopy when the file changes (only when this value does), so the path names
# the version. `cargo xtask fetch-v8` verifies the file's SHA-256 (fetching it,
# or replacing a wrong one and cleaning what cargo built from it); the pin
# guards the download, not local writes to target/. crates/xtask/src/v8_archive.rs
# holds the pin this path must match.
RUSTY_V8_ARCHIVE = { value = "target/rusty_v8/v150.4.0/librusty_v8_simdutf_release_x86_64-unknown-linux-gnu.a.gz", relative = true }

[target.x86_64-unknown-linux-gnu]
# compact relative relocations (`DT_RELR`): the PIE's relocations shrink from
# about 1.6 MB to about 18 KB and apply faster at startup, keeping address
# randomization. Needs glibc 2.36 or later where it runs (the release's floor
# is 2.39, and an older loader refuses the binary by its `GLIBC_ABI_DT_RELR`
# version). `RUSTFLAGS` or `CARGO_ENCODED_RUSTFLAGS` in the environment
# replaces this list, and this list overrides any `build.rustflags`.
rustflags = ["-C", "link-arg=-Wl,-z,pack-relative-relocs"]
